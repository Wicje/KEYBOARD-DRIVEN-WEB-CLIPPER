[package]
name = "clipper"
version = "0.1.0"
edition = "2021"
authors = ["Clipper Contributors"]
description = "A fast, keyboard-driven web clipper and bookmark manager for the terminal"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies"] }
scraper = "0.19"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
ratatui = "0.28"
crossterm = "0.28"
open = "5.1"
anyhow = "1.0"
thiserror = "1.0"
comfy-table = "7.1"
regex = "1.10"
headless_chrome = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
screenshot = ["dep:headless_chrome"]
