name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: clipper-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: clipper-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: clipper-darwin-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: clipper-windows-amd64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binaries
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/clipper.exe" "dist/${{ matrix.artifact_name }}"
            cd dist && tar -czvf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"
          else
            cp "target/${{ matrix.target }}/release/clipper" "dist/${{ matrix.artifact_name }}"
            cd dist && tar -czvf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"
          fi
          sha256sum *.tar.gz > checksums-${{ matrix.artifact_name }}.txt || shasum -a 256 *.tar.gz > checksums-${{ matrix.artifact_name }}.txt

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums-*.txt
          generate_release_notes: true
